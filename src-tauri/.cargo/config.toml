# llama.cpp must use the static CRT (/MT) so every native dep links against
# the same runtime — mixing /MT and /MD CRTs fails to link (LNK2038/LNK1169).
# LLAMA_STATIC_CRT alone isn't enough: CMake policy CMP0091 strips CRT flags
# from CMAKE_<LANG>_FLAGS, so the runtime library must be set explicitly.
[env]
LLAMA_STATIC_CRT = "1"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
